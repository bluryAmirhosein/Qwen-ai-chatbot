{% extends "base.html" %}

{% block content %}
<div class="flex h-full relative">

  <!-- Sidebar: conversation history -->
  <aside
    id="sidebar"
    class="hidden md:flex w-72 shrink-0 border-l border-border bg-panel flex-col"
  >
    <div class="p-4 border-b border-border">
      <button
        id="new-chat-btn"
        class="w-full flex items-center justify-center gap-2 rounded-md bg-accent text-bg font-medium text-sm py-2.5 hover:opacity-90 transition-opacity"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        گفتگوی جدید
      </button>
    </div>

    <div class="p-3">
      <input
        id="search-input"
        type="search"
        placeholder="جستجو در گفتگوها"
        class="w-full bg-elevated border border-border rounded-md px-3 py-2 text-sm placeholder-dim focus:outline-none focus:ring-1 focus:ring-accent"
      />
    </div>

    <nav id="conversation-list" class="flex-1 overflow-y-auto px-2 space-y-1 pb-3"></nav>

    <div class="p-3 border-t border-border">
      <button
        id="rag-toggle-btn"
        class="w-full flex items-center gap-2 text-sm text-dim hover:text-ink transition-colors"
      >
        <span class="font-mono text-[10px] px-1.5 py-0.5 rounded bg-elevated border border-border">RAG</span>
        مدیریت اسناد
      </button>
    </div>
  </aside>

  <!-- Main chat column -->
  <main class="flex-1 flex flex-col min-w-0">
    <header class="h-14 border-b border-border flex items-center justify-between px-4 md:px-5 shrink-0">
      <div class="flex items-center gap-2 min-w-0">
        <button id="sidebar-toggle-btn" class="md:hidden text-dim hover:text-ink p-1 -m-1 shrink-0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 id="conversation-title" class="text-sm font-medium truncate">گفتگوی جدید</h1>
      </div>
      <div class="flex items-center gap-3 shrink-0">
        <span class="hidden sm:flex items-center gap-1.5 text-xs text-dim" title="qwen3-1.7b">
          <span class="w-1.5 h-1.5 rounded-full bg-accent"></span>
          آماده
        </span>
        <button id="delete-conversation-btn" class="hidden text-dim hover:text-danger text-xs transition-colors">
          حذف گفتگو
        </button>
      </div>
    </header>

    <section id="messages" class="flex-1 overflow-y-auto px-4 md:px-5 py-6 space-y-6">
      <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center text-dim px-4">
        <p class="text-lg text-ink mb-1">شروع یک گفتگو</p>
        <p class="text-sm max-w-sm">پیام خود را بنویسید. مدل به‌صورت محلی روی همین سرور اجرا می‌شود.</p>
      </div>
    </section>

    <footer class="border-t border-border p-3 md:p-4 shrink-0">
      <div
        id="context-chip"
        class="hidden mb-2 items-center gap-2 text-xs font-mono text-dim bg-elevated border border-border rounded px-2 py-1 w-fit max-w-full"
        dir="ltr"
      >
        <span id="context-chip-label" class="truncate"></span>
        <button id="context-chip-remove" class="text-dim hover:text-danger shrink-0">×</button>
      </div>

      <div class="flex items-end gap-2 bg-elevated border border-border rounded-lg p-2 focus-within:ring-1 focus-within:ring-accent">
        <button id="attach-btn" title="افزودن فایل به‌عنوان زمینه" class="p-2 text-dim hover:text-ink shrink-0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input id="file-input" type="file" accept=".txt,.md,.pdf,.docx" class="hidden" />

        <textarea
          id="message-input"
          rows="1"
          placeholder="پیام بنویسید..."
          class="flex-1 bg-transparent resize-none focus:outline-none text-sm py-2 max-h-40"
        ></textarea>

        <button
          id="send-btn"
          class="shrink-0 bg-accent text-bg rounded-md w-9 h-9 flex items-center justify-center disabled:opacity-40 disabled:cursor-not-allowed hover:opacity-90 transition-opacity"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="transform: scaleX(-1)"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </div>

      <div class="flex flex-wrap items-center gap-2 mt-3 text-xs">
        <select id="thinking-mode" class="param-select" title="عمق استدلال مدل">
          <option value="fast">fast</option>
          <option value="balanced">balanced</option>
          <option value="deep">deep</option>
        </select>

        <select id="personality" class="param-select" title="لحن پاسخ">
          <option value="neutral">neutral</option>
          <option value="friendly">friendly</option>
          <option value="formal">formal</option>
          <option value="concise">concise</option>
          <option value="technical">technical</option>
          <option value="humorous">humorous</option>
        </select>

        <select id="language" class="param-select" title="زبان پاسخ">
          <option value="english">english</option>
          <option value="persian">persian</option>
        </select>

        <label class="param-toggle">
          <input type="checkbox" id="web-search-toggle" />
          <span>web search</span>
        </label>

        <label class="param-toggle">
          <input type="checkbox" id="rag-toggle" />
          <span>RAG</span>
        </label>

        <div id="rag-top-k-wrap" class="hidden items-center gap-1.5" dir="ltr">
          <span class="text-dim font-mono">top_k</span>
          <input
            id="rag-top-k"
            type="number"
            min="1"
            max="20"
            value="4"
            class="w-14 bg-panel border border-border rounded px-1.5 py-1 font-mono text-xs focus:outline-none focus:border-accent"
          />
        </div>
      </div>
    </footer>
  </main>

  <!-- RAG documents drawer -->
  <aside
    id="rag-drawer"
    class="fixed inset-y-0 right-0 w-80 max-w-[85vw] bg-panel border-l border-border translate-x-full transition-transform duration-200 flex flex-col z-30"
  >
    <div class="h-14 flex items-center justify-between px-4 border-b border-border shrink-0">
      <h2 class="text-sm font-medium">اسناد RAG</h2>
      <button id="rag-drawer-close" class="text-dim hover:text-ink text-lg leading-none">×</button>
    </div>
    <div class="p-4 border-b border-border">
      <label class="block w-full text-center text-sm rounded-md border border-dashed border-border py-3 cursor-pointer text-dim hover:text-ink hover:border-accent transition-colors">
        بارگذاری سند جدید
        <div class="text-[11px] font-mono mt-0.5" dir="ltr">.txt, .md, .pdf, .docx</div>
        <input id="rag-upload-input" type="file" accept=".txt,.md,.pdf,.docx" class="hidden" />
      </label>
      <p id="rag-upload-status" class="text-xs text-dim mt-2 h-4"></p>
    </div>
    <div id="rag-doc-list" class="flex-1 overflow-y-auto"></div>
  </aside>

  <div id="drawer-backdrop" class="hidden fixed inset-0 bg-black/50 z-20"></div>
  <div id="sidebar-backdrop" class="hidden fixed inset-0 bg-black/50 z-20"></div>
</div>

<script>
  window.API_PREFIX = document.body.dataset.apiPrefix;
</script>
<script type="module" src="{{ url_for('static', path='js/app.js') }}"></script>
{% endblock %}
