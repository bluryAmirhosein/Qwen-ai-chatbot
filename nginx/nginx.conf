worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Uploads for /api/v1/files/extract and /api/v1/rag/ingest (pdf, docx, txt, md).
    client_max_body_size 50m;

    # Keep the original scheme when another proxy / TLS terminator sits in front of this nginx.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        server_name _;

        # Docker's embedded DNS. Together with the variable in proxy_pass below, nginx
        # re-resolves "app" at request time, so recreating the app container never leaves
        # nginx pointing at a stale IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $app_upstream http://app:8000;

        # CSS/JS served straight from disk (files are the bind-mounted app/static).
        # "no-cache" = the browser revalidates via ETag, so edited js/css show up right away.
        location /static/ {
            root /usr/share/nginx/html;
            access_log off;
            add_header Cache-Control "no-cache";
        }

        # Everything else goes to FastAPI: "/" is rendered there from app/templates/index.html
        # (Jinja2), plus /api/v1/*, /health and /docs.
        location / {
            proxy_pass $app_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Chat requests are synchronous and the first one also loads the model from disk,
            # on CPU this can take minutes. Keep these generous.
            proxy_connect_timeout 10s;
            proxy_send_timeout    900s;
            proxy_read_timeout    900s;
        }
    }
}